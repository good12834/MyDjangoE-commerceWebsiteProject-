# Render Blueprint for the ShopHub Django backend.
# Deploy from the Render dashboard: New + -> Blueprint -> pick this repo.
# Creates a managed PostgreSQL database and the `shophub-api` web service whose
# public URL is https://shophub-api.onrender.com (already baked into the
# deployed Vercel frontend as VITE_API_BASE).
databases:
  - name: shophub-db
    databaseName: shophub
    plan: free
    region: oregon

services:
  - type: web
    name: shophub-api
    # Docker (not the native Python runtime) so our Dockerfile fully controls the
    # build: pinned Python 3.12, pip install, collectstatic, and startup.
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: ./Dockerfile
    # The Dockerfile's CMD runs start.sh: migrate -> seed (first boot) -> Daphne.
    dockerCommand: bash start.sh
    healthCheckPath: /api/schema/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shophub-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      # Leading-dot matches shophub-api.onrender.com and any Render subdomain.
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://shophub-frontend-one.vercel.app"
      - key: FRONTEND_URL
        value: "https://shophub-frontend-one.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shophub-api.onrender.com"
      # Publishable key is public by design — safe to commit.
      - key: STRIPE_PUBLISHABLE_KEY
        value: "pk_test_51S6FlVQg4BXMauysYGfgPUFR0XRVYxespEng4NQoFr9OKQcBJ0pz3XVspEiGrCtMftbpIs3pnvl052QbqavWfDKW00OtJymeIB"
      # Secret values are prompted for in the dashboard — never stored in the repo.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
